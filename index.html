<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>博瀚打卡系統</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: "微軟正黑體", sans-serif; text-align: center; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 60vh; background: #111; }
        video, canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .ui { padding: 15px; background: #000; height: 40vh; box-sizing: border-box; }
        .btn { padding: 18px 0; font-size: 22px; border-radius: 12px; border: none; margin: 8px 1%; font-weight: bold; width: 45%; cursor: pointer; }
        .on { background: #2E7D32; color: white; }
        .off { background: #C62828; color: white; }
        .reg { background: #333; color: #bbb; width: 93%; margin-top: 10px; font-size: 14px; border: 1px solid #444; }
        #status { font-size: 18px; color: #FFFFFF; padding: 12px; background: #222; min-height: 40px; }
        .loading-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="status">博瀚 AI 初始化中...</div>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="ui">
        <button class="btn on" onclick="handleAction('上班')">上班打卡</button>
        <button class="btn off" onclick="handleAction('下班')">下班打卡</button>
        <button class="btn reg" onclick="startRegister()">註冊模式 (照片/現場註冊)</button>
        <input type="file" id="photoUpload" style="display:none;" accept="image/*" onchange="handleFileUpload(this)">
    </div>
    <div id="mask" class="loading-mask"><div id="mask-text" style="font-size: 20px;">處理中...</div></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbzIS_t6OVMMmnlTzlgnhgs-QHzXmB9RclgT25BSvEVWzVSh1J76_mWAaAhhRhbJwT-m5Q/exec"; 
        let faceMatcher = null, isEngineReady = false, currentDetectedName = "未知", currentDescriptor = null;
        let unknownCounter = 0; 
        const UNKNOWN_LIMIT = 20; // 提高容錯率，減少閃爍
        window.isVerifying = false;

        async function init() {
            try {
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                await syncKnownFaces();
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user" } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.onloadedmetadata = () => { isEngineReady = true; startDetectionLoop(); };
            } catch (err) { alert("啟動失敗: " + err.message); }
        }

        async function syncKnownFaces() {
            try { 
                const resp = await fetch(API_URL);
                const rawData = await resp.json();
                if (!rawData.length) return;
                const nameMap = {};
                rawData.forEach(u => { 
                    if (!nameMap[u.name]) nameMap[u.name] = []; 
                    nameMap[u.name].push(new Float32Array(u.features)); 
                });
                const labeledDescriptors = Object.keys(nameMap).map(name => new faceapi.LabeledFaceDescriptors(name, nameMap[name]));
                // 門檻降至 0.35 (極限靈敏版)
                faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.35);
            } catch(e) { console.error("同步失敗"); }
        }

        async function startDetectionLoop() {
            const video = document.getElementById('video'), overlay = document.getElementById('overlay');
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(overlay, displaySize);

            async function render() {
                if (!window.isVerifying && isEngineReady) {
                    // 使用更高精準度的辨識 (SSD Mobilenet v1)
                    const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();
                    const resized = faceapi.resizeResults(detections, displaySize);
                    const ctx = overlay.getContext('2d');
                    ctx.clearRect(0, 0, overlay.width, overlay.height);

                    if (resized.length > 0) {
                        currentDescriptor = resized[0].descriptor;
                        if (faceMatcher) {
                            const match = faceMatcher.findBestMatch(currentDescriptor);
                            if (match.label !== "unknown") { 
                                currentDetectedName = match.label; 
                                unknownCounter = 0; 
                            } else { 
                                if (++unknownCounter >= UNKNOWN_LIMIT) currentDetectedName = "未知"; 
                            }
                        }
                        
                        const box = resized[0].detection.box;
                        ctx.save();
                        
                        // 1. 畫框
                        ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 4;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        
                        // 2. 正向文字處理 (修正反轉)
                        ctx.scale(-1, 1);
                        ctx.font = "bold 28px 微軟正黑體";
                        ctx.fillStyle = "#FFFFFF";
                        const textX = -(box.x + box.width); 
                        ctx.fillText(currentDetectedName, textX, box.y - 15);
                        
                        ctx.restore();
                        document.getElementById('status').innerText = "識別中：" + currentDetectedName;
                    } else { 
                        if (++unknownCounter >= UNKNOWN_LIMIT) currentDetectedName = "未知"; 
                        document.getElementById('status').innerText = "請對準臉部"; 
                    }
                }
                requestAnimationFrame(render);
            }
            render();
        }

        async function runLivenessCheck() {
            const tasks = [{id:'left', text:'🔥 請向左轉頭'}, {id:'right', text:'🔥 請向右轉頭'}];
            const task = tasks[Math.floor(Math.random()*tasks.length)];
            document.getElementById('status').innerHTML = `<span style="color:#FFEB3B;font-size:24px;">${task.text}</span>`;
            let start = Date.now();
            while(Date.now() - start < 6000) {
                const d = await faceapi.detectSingleFace(document.getElementById('video')).withFaceLandmarks();
                if(d) {
                    const l = d.landmarks, nose = l.getNose()[0], jaw = l.getJawOutline();
                    const pos = (nose.x - jaw[0].x) / (jaw[16].x - jaw[0].x);
                    if((task.id === 'left' && pos > 0.72) || (task.id === 'right' && pos < 0.28)) return true;
                }
                await new Promise(r => setTimeout(r, 60));
            }
            return false;
        }

        async function handleAction(act) {
            if (currentDetectedName === "未知") return alert("辨識未通過，請對準鏡頭");
            window.isVerifying = true;
            if (!(await runLivenessCheck())) { alert("驗證失敗，請重試"); window.isVerifying = false; return; }
            document.getElementById('mask').style.display = "flex";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(API_URL, { 
                        method: "POST", 
                        body: JSON.stringify({ type: "CHECKIN", name: currentDetectedName, action: act, lat: pos.coords.latitude, lng: pos.coords.longitude }) 
                    });
                    const msg = await res.text();
                    alert(msg === "SUCCESS" ? `✅ ${act}完成！` : `📢 ${msg}`);
                } catch(e) { alert("連線超時"); }
                document.getElementById('mask').style.display = "none"; window.isVerifying = false;
            }, () => { alert("請開啟GPS定位"); document.getElementById('mask').style.display = "none"; window.isVerifying = false; }, { enableHighAccuracy: true });
        }

        async function startRegister() {
            const pw = prompt("管理密碼："); if (pw !== "0000") return;
            const usePhoto = confirm("要用照片註冊嗎？");
            if (usePhoto) document.getElementById('photoUpload').click();
            else {
                const name = prompt("老師姓名："); if (!name) return;
                // 現場錄製增加到 10 次特徵抓取，提高成功率
                for(let i=1; i<=10; i++) {
                    document.getElementById('status').innerText = `正在抓取特徵 (${i}/10)...`;
                    await new Promise(r => setTimeout(r, 700));
                    if(currentDescriptor) await fetch(API_URL, { method:"POST", body: JSON.stringify({type:"REGISTER", name, features:Array.from(currentDescriptor)}) });
                }
                alert("註冊完畢，系統將自動同步"); location.reload();
            }
        }

        async function handleFileUpload(input) {
            const name = prompt("老師姓名："); if (!name || !input.files[0]) return;
            try {
                const img = await faceapi.bufferToImage(input.files[0]);
                const d = await faceapi.detectSingleFace(img).withFaceLandmarks().withFaceDescriptor();
                if (d) { 
                    await fetch(API_URL, { method:"POST", body: JSON.stringify({type:"REGISTER", name, features:Array.from(d.descriptor)}) }); 
                    alert("照片註冊完成"); 
                } else alert("照片中辨識不到人臉");
            } catch(e) { alert("處理錯誤"); }
            location.reload();
        }
        window.onload = init;
    </script>
</body>
</html>
