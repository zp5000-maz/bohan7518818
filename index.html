<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>博瀚考勤系統 V6.2 專業版</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { margin: 0; background: #0b0e14; color: white; font-family: "微軟正黑體", sans-serif; text-align: center; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 50vh; background: #000; border-bottom: 2px solid #fff; }
        video { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; }
        .ui { padding: 15px; background: #0b0e14; height: 50vh; box-sizing: border-box; display: flex; flex-direction: column; }
        .btn-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .btn { padding: 18px 0; font-size: 22px; border-radius: 15px; border: none; font-weight: bold; width: 48%; cursor: pointer; }
        .on { background: linear-gradient(135deg, #2e7d32, #43a047); color: white; }
        .off { background: linear-gradient(135deg, #c62828, #e53935); color: white; }
        .reg-group { width: 100%; border: 1px solid #444; border-radius: 15px; padding: 10px; box-sizing: border-box; background: #1a1f26; margin-bottom: 15px; }
        .btn-reg { padding: 12px 0; font-size: 16px; border-radius: 10px; border: 1px solid #555; width: 48%; background: #252a33; color: #fff; cursor: pointer; }
        #status { font-size: 20px; color: #fff; padding: 12px; background: #1a1f26; min-height: 45px; font-weight: bold; }
        #liveness-overlay { position: fixed; top: 10%; left: 50%; transform: translateX(-50%); background: #fff; color: #000; padding: 15px 30px; border-radius: 50px; font-size: 24px; font-weight: bold; display: none; z-index: 50; }
        .loading-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
    </style>
</head>
<body>
    <div id="status">⚡ 系統秒辨識引擎載入中...</div>
    <div id="liveness-overlay">請開始活體辨識</div>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="ui">
        <div class="btn-row">
            <button class="btn on" id="btn-in">上班打卡</button>
            <button class="btn off" id="btn-out">下班打卡</button>
        </div>
        <div class="reg-group">
            <div style="color: #bbb; font-size: 14px; margin-bottom: 8px;">管理員設定 (需密碼)</div>
            <div style="display: flex; justify-content: space-between;">
                <button class="btn-reg" onclick="validateAdmin('live')">現場連拍註冊</button>
                <button class="btn-reg" onclick="validateAdmin('photo')">照片匯入註冊</button>
            </div>
        </div>
        <input type="file" id="photoUpload" style="display:none;" accept="image/*" onchange="handlePhotoRegister(this)">
    </div>
    <div id="mask" class="loading-mask"><div id="mask-text" style="color:white; font-size:18px; padding:20px;">處理中...</div></div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbyu7jJFbJx1qHF6M06C_-OhwI_e5NpPSikGOUy4P5KCoDpD_Mte4dr2zO0ZckROzkMe/exec"; 
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
        let faceMatcher = null, isEngineReady = false, currentDetectedName = "未知";
        let isCheckingLiveness = false, livenessTarget = "", pendingName = ""; 
        let pendingAction = "";
        window.isSystemLocked = false;

        async function init() {
            const STATUS_DIV = document.getElementById('status');
            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                const resp = await fetch(API_URL);
                const teachersData = await resp.json();
                if (teachersData.length) {
                    const labeled = teachersData.map(u => {
                        const descriptors = u.features.map(f => new Float32Array(f));
                        return new faceapi.LabeledFaceDescriptors(u.name, descriptors);
                    });
                    faceMatcher = new faceapi.FaceMatcher(labeled, 0.6);
                }
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640 } });
                document.getElementById('video').srcObject = stream;
                document.getElementById('video').onloadedmetadata = () => {
                    isEngineReady = true; 
                    STATUS_DIV.innerText = "請對準鏡頭";
                    startDetectionLoop();
                };
            } catch(e) { STATUS_DIV.innerText = "引擎載入失敗"; }
        }

        async function startDetectionLoop() {
            const video = document.getElementById('video'), overlay = document.getElementById('overlay');
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(overlay, displaySize);
            async function render() {
                if (!window.isSystemLocked && isEngineReady) {
                    const d = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 }))
                        .withFaceLandmarks().withFaceDescriptor();
                    const ctx = overlay.getContext('2d'); 
                    ctx.clearRect(0, 0, overlay.width, overlay.height);
                    if (d) {
                        const resized = faceapi.resizeResults(d, displaySize);
                        let matchLabel = "未知";
                        if (faceMatcher) {
                            const match = faceMatcher.findBestMatch(resized.descriptor);
                            matchLabel = match.label !== "unknown" ? match.label : "未知";
                        }
                        currentDetectedName = matchLabel;
                        const box = resized.detection.box;
                        const x = displaySize.width - box.x - box.width; 
                        ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 4;
                        ctx.strokeRect(x, box.y, box.width, box.height);
                        ctx.font = "bold 24px 微軟正黑體"; ctx.fillStyle = "#FFFFFF";
                        ctx.fillText(currentDetectedName, x + 5, box.y - 10);
                        
                        if (isCheckingLiveness) {
                            if (currentDetectedName !== pendingName) {
                                isCheckingLiveness = false;
                                document.getElementById('liveness-overlay').style.display = "none";
                                alert("【辨識中斷】偵測到非本人！請本人重新操作。"); return;
                            }
                            const landmarks = d.landmarks;
                            if (livenessTarget === "left" || livenessTarget === "right") {
                                const nose = landmarks.getNose()[0];
                                const jaw = landmarks.getJawOutline();
                                const nosePos = (nose.x - jaw[0].x) / (jaw[16].x - jaw[0].x);
                                if (livenessTarget === "left" && nosePos > 0.72) finishLiveness();
                                if (livenessTarget === "right" && nosePos < 0.28) finishLiveness();
                            } else if (livenessTarget === "mouth") {
                                const mouth = landmarks.getMouth();
                                const topLip = mouth[14].y; const bottomLip = mouth[18].y; 
                                if ((bottomLip - topLip) / (mouth[6].x - mouth[0].x) > 0.3) finishLiveness(); 
                            }
                        }
                    } else { 
                        currentDetectedName = "未知"; 
                        if (isCheckingLiveness) {
                             isCheckingLiveness = false;
                             document.getElementById('liveness-overlay').style.display = "none";
                             alert("活體辨識失敗：人臉離開鏡頭");
                        }
                    }
                }
                requestAnimationFrame(render);
            }
            render();
        }

        document.getElementById('btn-in').onclick = () => {
            if (currentDetectedName === "未知") return alert("請對準鏡頭辨識身分");
            pendingName = currentDetectedName;
            startLivenessCheck('上班');
        };
        document.getElementById('btn-out').onclick = () => {
            if (currentDetectedName === "未知") return alert("請對準鏡頭辨識身分");
            pendingName = currentDetectedName;
            pendingAction = "下班";
            handleAction(); 
        };

        function startLivenessCheck(act) {
            pendingAction = act;
            isCheckingLiveness = true;
            const targets = ["left", "right", "mouth"];
            livenessTarget = targets[Math.floor(Math.random() * targets.length)];
            const overlay = document.getElementById('liveness-overlay');
            const hints = { "left": "⬅️ 請向左轉頭", "right": "➡️ 請向右轉頭", "mouth": "😮 請張開嘴巴" };
            overlay.innerText = hints[livenessTarget];
            overlay.style.display = "block";
        }

        function finishLiveness() {
            isCheckingLiveness = false;
            document.getElementById('liveness-overlay').style.display = "none";
            handleAction(); 
        }

        async function handleAction() {
            const finalName = pendingName; 
            window.isSystemLocked = true;
            document.getElementById('mask').style.display = "flex";
            document.getElementById('mask-text').innerText = "系統驗證中...";
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(API_URL, { 
                        method: "POST", 
                        body: JSON.stringify({ 
                            type: "CHECKIN", 
                            name: finalName, 
                            action: pendingAction, 
                            lat: pos.coords.latitude, 
                            lng: pos.coords.longitude 
                        }) 
                    });
                    alert(await res.text()); 
                } catch (e) { alert("連線失敗"); }
                location.reload();
            }, () => { alert("請開啟 GPS 定位"); location.reload(); });
        }

        async function validateAdmin(mode) {
            const pw = prompt("管理密碼："); if (!pw) return;
            const res = await fetch(API_URL, { method: "POST", body: JSON.stringify({ type: "CHECK_PW", pw: pw }) });
            if (await res.text() === "AUTH_OK") {
                mode === 'live' ? startLiveRegister() : document.getElementById('photoUpload').click();
            } else { alert("密碼錯誤"); }
        }

        async function startLiveRegister() {
            const name = prompt("姓名："); if (!name) return;
            window.isSystemLocked = true;
            document.getElementById('mask').style.display = "flex";
            const descriptors = [];
            for (let i = 1; i <= 10; i++) {
                document.getElementById('mask-text').innerHTML = `正在註冊 (${i}/10)...`;
                const d = await faceapi.detectSingleFace(document.getElementById('video'), new faceapi.SsdMobilenetv1Options()).withFaceLandmarks().withFaceDescriptor();
                if (d) descriptors.push(Array.from(d.descriptor)); else i--;
                await new Promise(r => setTimeout(r, 400));
            }
            if (descriptors.length >= 8) {
                await fetch(API_URL, { method:"POST", body: JSON.stringify({ type:"REGISTER", name: name, features: descriptors }) });
                alert("註冊成功！");
            }
            location.reload();
        }

        async function handlePhotoRegister(input) {
            const name = prompt("姓名："); if(!name) return;
            window.isSystemLocked = true;
            document.getElementById('mask').style.display = "flex";
            try {
                const img = await faceapi.bufferToImage(input.files[0]);
                const d = await faceapi.detectSingleFace(img, new faceapi.SsdMobilenetv1Options()).withFaceLandmarks().withFaceDescriptor();
                if (d) {
                    await fetch(API_URL, { method:"POST", body: JSON.stringify({ type:"REGISTER", name: name, features: [Array.from(d.descriptor)] }) });
                    alert("照片註冊完成！");
                } else { alert("無法辨識臉部"); }
            } catch (e) { alert("發生錯誤"); }
            location.reload();
        }
        window.onload = init;
    </script>
</body>
</html>
