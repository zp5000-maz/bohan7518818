
<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>博瀚考勤系統 V5.5 旗艦優化版</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { margin: 0; background: #0b0e14; color: white; font-family: "微軟正黑體", sans-serif; text-align: center; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 50vh; background: #000; border-bottom: 2px solid #2e7d32; }
        video, canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .ui { padding: 15px; background: #0b0e14; height: 50vh; box-sizing: border-box; display: flex; flex-direction: column; justify-content: flex-start; }
        .btn-row { display: flex; justify-content: space-between; margin-bottom: 10px; }
        .btn { padding: 18px 0; font-size: 22px; border-radius: 15px; border: none; font-weight: bold; width: 48%; cursor: pointer; transition: 0.2s; }
        .on { background: linear-gradient(135deg, #2e7d32, #43a047); color: white; box-shadow: 0 4px 15px rgba(46, 125, 50, 0.4); }
        .off { background: linear-gradient(135deg, #c62828, #e53935); color: white; box-shadow: 0 4px 15px rgba(198, 40, 40, 0.4); }
        .btn:active { transform: scale(0.95); }
        .reg-group { width: 100%; border: 1px solid #333; border-radius: 15px; padding: 12px; box-sizing: border-box; background: #1a1f26; margin-top: auto; margin-bottom: 20px;}
        .btn-reg { padding: 12px 0; font-size: 16px; border-radius: 10px; border: 1px solid #444; width: 48%; background: #252a33; color: #bbb; cursor: pointer; }
        #status { font-size: 20px; color: #fff; padding: 12px; background: #1a1f26; min-height: 45px; font-weight: bold; border-bottom: 1px solid #333; }
        .loading-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .spinner { border: 4px solid rgba(255,255,255,0.1); width: 36px; height: 36px; border-radius: 50%; border-left-color: #2e7d32; animation: spin 1s linear infinite; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="status">系統初始化中...</div>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="ui">
        <div class="btn-row">
            <button class="btn on" onclick="handleAction('上班')">上班打卡</button>
            <button class="btn off" onclick="handleAction('下班')">下班打卡</button>
        </div>
        <div class="reg-group">
            <div style="color: #888; font-size: 14px; margin-bottom: 8px;">管理員功能 (需密碼)</div>
            <div style="display: flex; justify-content: space-between;">
                <button class="btn-reg" onclick="startLiveRegister()">現場連拍註冊</button>
                <button class="btn-reg" onclick="triggerPhotoUpload()">照片匯入註冊</button>
            </div>
        </div>
        <input type="file" id="photoUpload" style="display:none;" accept="image/*" onchange="handlePhotoRegister(this)">
    </div>
    <div id="mask" class="loading-mask">
        <div class="spinner"></div>
        <div id="mask-text" style="font-size:18px; color: #4CAF50;">處理中...</div>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbxf3ifuHGaGQZv1HfW4j64z6Xal8Ioe3inMGoJa0OOWum-mOBnp-JXPOCW4TmSbqJ_O/exec"; 
        const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
        const DEFAULT_PW = "0000";
        let faceMatcher = null, isEngineReady = false, currentDetectedName = "未知";
        window.isSystemLocked = false;

        async function init() {
            const STATUS_DIV = document.getElementById('status');
            STATUS_DIV.innerText = "⚡ 正在載入高精準 AI 引擎...";
            
            try {
                await Promise.all([
                    faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL),
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                
                const resp = await fetch(API_URL);
                const teachersData = await resp.json();
                if (teachersData.length) {
                    const labeled = teachersData.map(u => new faceapi.LabeledFaceDescriptors(u.name, u.features.map(f => new Float32Array(f))));
                    faceMatcher = new faceapi.FaceMatcher(labeled, 0.55);
                }
                
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 640 } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                
                video.onloadedmetadata = async () => {
                    // 預熱
                    await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions());
                    isEngineReady = true; 
                    STATUS_DIV.innerText = "請對準鏡頭";
                    startDetectionLoop();
                };
            } catch(e) {
                STATUS_DIV.innerText = "❌ 初始化失敗，請檢查網路";
            }
        }

        async function startDetectionLoop() {
            const video = document.getElementById('video'), overlay = document.getElementById('overlay');
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(overlay, displaySize);
            
            async function render() {
                if (!window.isSystemLocked && isEngineReady) {
                    const d = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160 })).withFaceLandmarks().withFaceDescriptor();
                    const ctx = overlay.getContext('2d'); 
                    ctx.clearRect(0, 0, overlay.width, overlay.height);
                    
                    if (d) {
                        const resized = faceapi.resizeResults(d, displaySize);
                        if (faceMatcher) {
                            const match = faceMatcher.findBestMatch(resized.descriptor);
                            currentDetectedName = match.label !== "unknown" ? match.label : "未知";
                        }
                        ctx.strokeStyle = currentDetectedName !== "未知" ? "#00FF00" : "#FF3D00";
                        ctx.lineWidth = 4; 
                        ctx.strokeRect(resized.detection.box.x, resized.detection.box.y, resized.detection.box.width, resized.detection.box.height);
                        document.getElementById('status').innerText = "辨識中： " + currentDetectedName;
                    } else {
                        currentDetectedName = "未知";
                        document.getElementById('status').innerText = "未偵測到人臉";
                    }
                }
                setTimeout(render, 120); 
            }
            render();
        }

        function checkPassword() {
            const pw = prompt("請輸入管理員密碼：");
            return pw === DEFAULT_PW;
        }

        async function startLiveRegister() {
            if (!checkPassword()) return alert("密碼錯誤");
            const name = prompt("請輸入老師姓名："); if (!name) return;
            window.isSystemLocked = true;
            document.getElementById('mask').style.display = "flex";
            const descriptors = [];
            for (let i = 1; i <= 10; i++) {
                document.getElementById('mask-text').innerText = `擷取高品質特徵 (${i}/10)...`;
                const d = await faceapi.detectSingleFace(document.getElementById('video'), new faceapi.SsdMobilenetv1Options()).withFaceLandmarks().withFaceDescriptor();
                if (d) descriptors.push(Array.from(d.descriptor));
                await new Promise(r => setTimeout(r, 250));
            }
            if (descriptors.length >= 7) {
                await fetch(API_URL, { method:"POST", body: JSON.stringify({ type:"REGISTER", name: name, features: descriptors }) });
                alert("註冊成功！");
            } else alert("環境不佳，註冊失敗，請對準光源中心。");
            location.reload();
        }

        function triggerPhotoUpload() {
            if (!checkPassword()) return alert("密碼錯誤");
            document.getElementById('photoUpload').click();
        }

        async function handlePhotoRegister(input) {
            const file = input.files[0]; if(!file) return;
            const name = prompt("請輸入照片中的老師姓名："); if(!name) return;
            window.isSystemLocked = true;
            document.getElementById('mask').style.display = "flex";
            const img = await faceapi.bufferToImage(file);
            const d = await faceapi.detectSingleFace(img, new faceapi.SsdMobilenetv1Options()).withFaceLandmarks().withFaceDescriptor();
            if (d) {
                await fetch(API_URL, { method:"POST", body: JSON.stringify({ type:"REGISTER", name: name, features: [Array.from(d.descriptor)] }) });
                alert("照片註冊成功！");
            } else alert("無法解析照片中的臉部特徵");
            location.reload();
        }

        async function handleAction(act) {
            if (currentDetectedName === "未知") return alert("請對準鏡頭，顯示姓名後再打卡");
            const finalName = currentDetectedName; 
            window.isSystemLocked = true;
            document.getElementById('mask').style.display = "flex";
            document.getElementById('mask-text').innerText = `辦理 ${finalName} ${act}...`;
            
            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(API_URL, { 
                        method: "POST", 
                        body: JSON.stringify({ 
                            type: "CHECKIN", 
                            name: finalName, 
                            action: act, 
                            lat: pos.coords.latitude, 
                            lng: pos.coords.longitude 
                        }) 
                    });
                    const resultText = await res.text();
                    alert(resultText);
                } catch(e) {
                    alert("網路異常，請稍後再試");
                }
                location.reload();
            }, (err) => { 
                alert("請開啟 GPS 定位授權"); 
                location.reload(); 
            }, { enableHighAccuracy: true });
        }
        window.onload = init;
    </script>
</body>
</html>
