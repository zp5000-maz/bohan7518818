<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>博瀚打卡系統 V3.1</title>
    <script defer src="https://cdn.jsdelivr.net/npm/face-api.js@0.22.2/dist/face-api.min.js"></script>
    <style>
        body { margin: 0; background: #000; color: white; font-family: "微軟正黑體", sans-serif; text-align: center; overflow: hidden; }
        #container { position: relative; width: 100vw; height: 60vh; background: #111; }
        video, canvas { position: absolute; left: 0; top: 0; width: 100%; height: 100%; object-fit: cover; transform: scaleX(-1); }
        .ui { padding: 15px; background: #000; height: 40vh; box-sizing: border-box; }
        .btn { padding: 18px 0; font-size: 22px; border-radius: 12px; border: none; margin: 8px 1%; font-weight: bold; width: 45%; cursor: pointer; transition: opacity 0.2s; }
        .btn:active { opacity: 0.7; }
        .on { background: #2E7D32; color: white; }
        .off { background: #C62828; color: white; }
        .reg { background: #333; color: #bbb; width: 93%; margin-top: 10px; font-size: 14px; border: 1px solid #444; }
        #status { font-size: 20px; color: #FFFFFF; padding: 12px; background: #222; min-height: 45px; font-weight: bold; display: flex; align-items: center; justify-content: center; }
        .loading-mask { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); display: none; z-index: 100; flex-direction: column; justify-content: center; align-items: center; }
        .liveness-prompt { color: #FFEB3B; font-size: 28px; font-weight: 900; text-shadow: 2px 2px 4px #000; animation: blink 0.6s infinite; }
        @keyframes blink { 50% { opacity: 0.3; } }
    </style>
</head>
<body>
    <div id="status">系統初始化中...</div>
    <div id="container">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="overlay"></canvas>
    </div>
    <div class="ui">
        <button id="btnOn" class="btn on" onclick="handleAction('上班')">上班打卡</button>
        <button id="btnOff" class="btn off" onclick="handleAction('下班')">下班打卡</button>
        <button class="btn reg" onclick="startRegister()">註冊模式 (管理員專用)</button>
        <input type="file" id="photoUpload" style="display:none;" accept="image/*" onchange="handleFileUpload(this)">
    </div>
    <div id="mask" class="loading-mask">
        <div id="mask-text" style="font-size: 22px;">處理中...</div>
    </div>

    <script>
        // !! 重要：請替換為您部署後產生的新網址 !!
        const API_URL = "https://script.google.com/macros/s/AKfycbwiS_QakT6_8GSfIztV4BZ3vcWQ8y-xz9SANR_IxokjsS_F5wkMMMm7mHC0IsufvPus/exec"; 
        
        let faceMatcher = null, isEngineReady = false, currentDetectedName = "未知", currentDescriptor = null;
        let unknownCounter = 0; 
        const UNKNOWN_LIMIT = 3; 
        window.isVerifying = false; 

        async function init() {
            try {
                const STATUS_DIV = document.getElementById('status');
                const MODEL_URL = 'https://cdn.jsdelivr.net/gh/justadudewhohacks/face-api.js@master/weights';
                STATUS_DIV.innerText = "載入 AI 引擎中...";
                await Promise.all([
                    faceapi.nets.tinyFaceDetector.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL), 
                    faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
                ]);
                STATUS_DIV.innerText = "同步老師資料中...";
                await syncKnownFaces();
                const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 1280, height: 720 } });
                const video = document.getElementById('video');
                video.srcObject = stream;
                video.onloadedmetadata = () => {
                    isEngineReady = true;
                    STATUS_DIV.innerText = "請對準鏡頭";
                    startDetectionLoop();
                };
            } catch (err) { alert("相機啟動失敗: " + err.message); }
        }

        async function syncKnownFaces() {
            try { 
                const resp = await fetch(API_URL, { method: 'GET', mode: 'cors' });
                const teachersData = await resp.json();
                if (!teachersData.length) return;
                faceMatcher = new faceapi.FaceMatcher(teachersData.map(u => new faceapi.LabeledFaceDescriptors(u.name, [new Float32Array(u.features)])), 0.4);
            } catch(e) { console.error("同步失敗"); }
        }

        async function startDetectionLoop() {
            const video = document.getElementById('video'), overlay = document.getElementById('overlay');
            const STATUS_DIV = document.getElementById('status');
            const displaySize = { width: video.offsetWidth, height: video.offsetHeight };
            faceapi.matchDimensions(overlay, displaySize);
            const detectorOptions = new faceapi.TinyFaceDetectorOptions({ inputSize: 224, scoreThreshold: 0.5 });

            async function render() {
                // 只有在未進行打卡動作時才持續辨識姓名
                if (!window.isVerifying && isEngineReady) {
                    const detection = await faceapi.detectSingleFace(video, detectorOptions).withFaceLandmarks().withFaceDescriptor();
                    const ctx = overlay.getContext('2d');
                    ctx.clearRect(0, 0, overlay.width, overlay.height);

                    if (detection) {
                        const resized = faceapi.resizeResults(detection, displaySize);
                        currentDescriptor = resized.descriptor;
                        if (faceMatcher) {
                            const match = faceMatcher.findBestMatch(currentDescriptor);
                            if (match.label !== "unknown") { 
                                currentDetectedName = match.label; 
                                unknownCounter = 0;
                                STATUS_DIV.innerText = "辨識成功： " + currentDetectedName;
                            } else { 
                                if (++unknownCounter >= UNKNOWN_LIMIT) {
                                    currentDetectedName = "未知";
                                    STATUS_DIV.innerText = "辨識中： 未知人員";
                                }
                            }
                        }
                        // 繪製白色辨識 UI
                        const box = resized.detection.box;
                        ctx.save();
                        ctx.strokeStyle = "#FFFFFF"; ctx.lineWidth = 4;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                        ctx.scale(-1, 1);
                        ctx.font = "bold 24px 微軟正黑體"; ctx.fillStyle = "#FFFFFF";
                        ctx.fillText(currentDetectedName, -(box.x + box.width), box.y - 15);
                        ctx.restore();
                    } else {
                        if (++unknownCounter >= UNKNOWN_LIMIT) {
                            currentDetectedName = "未知";
                            STATUS_DIV.innerText = "請對準鏡頭";
                        }
                    }
                }
                requestAnimationFrame(render);
            }
            render();
        }

        async function runLivenessCheck() {
            const video = document.getElementById('video');
            const STATUS_DIV = document.getElementById('status');
            const tasks = [{id:'left', text:'🔥 請向左轉頭'}, {id:'right', text:'🔥 請向右轉頭'}];
            const task = tasks[Math.floor(Math.random()*tasks.length)];
            STATUS_DIV.innerHTML = `<span class="liveness-prompt">${task.text}</span>`;
            
            let start = Date.now();
            const timeout = 8000; 
            while(Date.now() - start < timeout) {
                const d = await faceapi.detectSingleFace(video, new faceapi.TinyFaceDetectorOptions({ inputSize: 160, scoreThreshold: 0.4 })).withFaceLandmarks();
                if(d) {
                    const nose = d.landmarks.getNose()[0];
                    const jaw = d.landmarks.getJawOutline();
                    const pos = (nose.x - jaw[0].x) / (jaw[16].x - jaw[0].x);
                    if((task.id === 'left' && pos > 0.7) || (task.id === 'right' && pos < 0.3)) {
                        STATUS_DIV.innerHTML = `<span style="color:#4CAF50; font-size:28px;">✅ 驗證成功</span>`;
                        await new Promise(r => setTimeout(r, 800));
                        return true;
                    }
                }
                await new Promise(r => setTimeout(r, 100));
            }
            return false;
        }

        async function handleAction(act) {
            if (!isEngineReady) return;
            if (currentDetectedName === "未知") return alert("辨識未通過");
            
            const finalName = currentDetectedName; // 鎖定姓名，防止變回未知
            window.isVerifying = true; 
            
            const isRealPerson = await runLivenessCheck();
            if (!isRealPerson) { 
                alert("❌ 驗證超時"); 
                completeVerification();
                return; 
            }
            
            document.getElementById('mask').style.display = "flex";
            document.getElementById('mask-text').innerText = `正在為 ${finalName} 辦理${act}...`;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                try {
                    const res = await fetch(API_URL, { 
                        method: "POST", mode: 'cors',
                        body: JSON.stringify({ 
                            type: "CHECKIN", name: finalName, action: act, 
                            lat: pos.coords.latitude, lng: pos.coords.longitude 
                        }) 
                    });
                    alert(await res.text());
                } catch(e) { alert("網路連線錯誤"); }
                completeVerification();
            }, () => { alert("請開啟 GPS 定位"); completeVerification(); }, { enableHighAccuracy: true });
        }

        function completeVerification() {
            document.getElementById('mask').style.display = "none"; 
            window.isVerifying = false;
            document.getElementById('status').innerText = "請對準鏡頭";
        }

        async function startRegister() {
            const pw = prompt("管理密碼："); if (pw !== "0000") return;
            const name = prompt("老師姓名："); if (!name) return;
            window.isVerifying = true;
            document.getElementById('mask').style.display = "flex";
            document.getElementById('mask-text').innerText = "擷取特徵中...";
            const d = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();
            if(d) {
                await fetch(API_URL, { method:"POST", mode: 'cors', body: JSON.stringify({ type:"REGISTER", name: name, features: Array.from(d.descriptor) }) });
                alert("註冊成功！系統自動重啟"); location.reload();
            } else { alert("辨識失敗"); completeVerification(); }
        }

        async function handleFileUpload(input) {
            const name = prompt("姓名："); if (!name || !input.files[0]) return;
            document.getElementById('mask').style.display = "flex";
            const img = await faceapi.bufferToImage(input.files[0]);
            const d = await faceapi.detectSingleFace(img, new faceapi.SsdMobilenetv1Options()).withFaceLandmarks().withFaceDescriptor();
            if (d) { 
                await fetch(API_URL, { method:"POST", mode: 'cors', body: JSON.stringify({ type:"REGISTER", name: name, features: Array.from(d.descriptor) }) });
                location.reload(); 
            } else alert("無效照片");
        }

        window.onload = init;
    </script>
</body>
</html>
